<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Countdown</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0e0e0e;
      color: white;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 0;
      font-weight: normal;
      opacity: 0.8;
    }

    #countdown {
      display: flex;
      gap: 20px;
      margin-top: 40px;
    }

    

    .time-box {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      min-width: 110px;
    }

    .number {
      font-size: 3rem;
      font-weight: bold;
      display: block;
    }

    .label {
      font-size: 0.9rem;
      opacity: 0.7;
    }
    #birthdayBtn{
  display:none;
  margin-top:40px;
  padding:15px 35px;
  border:none;
  border-radius:12px;
  background:#ffffff;
  color:#111;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
}

#birthdayBtn:hover{
  transform:scale(1.05);
}

#waitingMessage{
  margin-top:20px;
  color:#bbb;
  font-size:1rem;
}

  </style>


</head>
<body>

  <h1>Birthday</h1>
  <h2 id="subtitle">Nungguin ya mwehee ;)</h2>

  <button id="birthdayBtn" onclick="location.href='https://adiprwoo.github.io/Hadi'">
  🎉 Buka Hadiahnya disini
  </button>


  <div id="countdown">
    <div class="time-box">
      <span class="number" id="days">0</span>
      <span class="label">Hari</span>
    </div>
    <div class="time-box">
      <span class="number" id="hours">0</span>
      <span class="label">Jam</span>
    </div>
    <div class="time-box">
      <span class="number" id="minutes">0</span>
      <span class="label">Menit</span>
    </div>
    <div class="time-box">
      <span class="number" id="seconds">0</span>
      <span class="label">Detik</span>
    </div>
  </div>

  <p id="waitingMessage">⏳ Balik lagi ya kalo waktunya udah habis.</p>

<script>
const target = new Date("2026-07-12T00:00:00");
let timer;

function updateCountdown() {
    const now = new Date();
    const diff = target - now;

    if (diff <= 0) {
        document.getElementById("subtitle").innerHTML = "🥳Yeyy!! HBD Hadi";
        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "0";
        document.getElementById("minutes").textContent = "0";
        document.getElementById("seconds").textContent = "0";

        document.getElementById("birthdayBtn").style.display = "inline-block";
        document.getElementById("waitingMessage").style.display = "none";

        if (timer) {
            clearInterval(timer);
        }

        return;
    }


    document.getElementById("subtitle").innerHTML = "Nungguin ya mwehee ;)";
    document.getElementById("birthdayBtn").style.display = "none";
    document.getElementById("waitingMessage").style.display = "block";

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCountdown();
timer = setInterval(updateCountdown, 1000);

</script>

</body>
</html>
